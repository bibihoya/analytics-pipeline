name: cinema-analytics

x-kafka-environment: &kafka-environment
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_HEAP_OPTS: -Xms128M -Xmx256M

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.9.0
  restart: unless-stopped
  healthcheck:
    test: [CMD-SHELL, 'kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1']
    interval: 20s
    timeout: 15s
    retries: 10
    start_period: 30s

services:
  kafka-1:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.9.0
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: [/bin/bash, /init.sh]
    environment:
      KAFKA_HEAP_OPTS: -Xms64M -Xmx128M
    volumes:
      - ./deploy/kafka/init.sh:/init.sh:ro

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128M -Xmx256M
    ports:
      - '${SCHEMA_REGISTRY_PORT:-18085}:8081'
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8081/subjects]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:25.3.3.42
    restart: unless-stopped
    depends_on:
      schema-registry:
        condition: service_healthy
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: '${CLICKHOUSE_PASSWORD:-cinema}'
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '${CLICKHOUSE_PORT:-18123}:8123'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d:ro
      - ./deploy/clickhouse/config.xml:/etc/clickhouse-server/config.d/resources.xml:ro
      - ./deploy/clickhouse/users.xml:/etc/clickhouse-server/users.d/resources.xml:ro
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --password "$$CLICKHOUSE_PASSWORD" --query "SELECT count() FROM cinema.raw_events" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  postgres:
    image: postgres:17.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-cinema}'
    ports:
      - '${POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cinema -d cinema']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./deploy/minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: '${S3_ACCESS_KEY:-minioadmin}'
      MINIO_ROOT_PASSWORD: '${S3_SECRET_KEY:-minioadmin}'
    ports:
      - '${S3_PORT:-19000}:9000'
      - '${S3_CONSOLE_PORT:-19001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 10

  movie-service:
    build:
      context: .
      target: runtime
      args:
        SERVICE: movie-service
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      HTTP_ADDR: :8080
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      GENERATOR_ENABLED: '${GENERATOR_ENABLED:-true}'
      GENERATOR_INTERVAL: '${GENERATOR_INTERVAL:-5s}'
      GENERATOR_HISTORY_DAYS: '${GENERATOR_HISTORY_DAYS:-8}'
    ports:
      - '${MOVIE_PORT:-18080}:8080'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 45s

  aggregation-service:
    build:
      context: .
      target: runtime
      args:
        SERVICE: aggregation-service
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      HTTP_ADDR: :8081
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_PASSWORD: '${CLICKHOUSE_PASSWORD:-cinema}'
      POSTGRES_DSN: 'postgres://cinema@postgres:5432/cinema?sslmode=disable'
      PGPASSWORD: '${POSTGRES_PASSWORD:-cinema}'
      AGGREGATION_INTERVAL: '${AGGREGATION_INTERVAL:-1m}'
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: '${S3_ACCESS_KEY:-minioadmin}'
      S3_SECRET_KEY: '${S3_SECRET_KEY:-minioadmin}'
      S3_BUCKET: movie-analytics
    ports:
      - '${AGGREGATION_PORT:-18081}:8081'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/health]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  grafana:
    build:
      context: ./deploy/grafana
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_PASSWORD:-admin}'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      CLICKHOUSE_PASSWORD: '${CLICKHOUSE_PASSWORD:-cinema}'
    ports:
      - '${GRAFANA_PORT:-13000}:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 12

  integration-test:
    profiles: [test]
    build:
      context: .
      target: integration-test
    depends_on:
      movie-service:
        condition: service_healthy
    environment:
      TEST_PRODUCER_URL: http://movie-service:8080
      TEST_CLICKHOUSE_URL: http://clickhouse:8123
      TEST_CLICKHOUSE_PASSWORD: '${CLICKHOUSE_PASSWORD:-cinema}'

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  clickhouse-data:
  postgres-data:
  minio-data:
  grafana-data:
